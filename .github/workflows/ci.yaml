name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - run: uv sync --locked

      - run: uv run coverage run -m pytest

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-checks: # referenced in Mergify conditions → name must be unique across ALL workflows
    needs: [test] # matrix job name → waits for ALL its instances
    runs-on: ubuntu-slim # lightest runner — the job runs no payload, only an echo
    steps:
      - run: echo "all test checks passed"
