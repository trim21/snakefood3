pull_request_rules:
  - name: label conflicts
    conditions:
      - conflict
    actions:
      label:
        toggle:
          - conflict

  - name: Automatic merge on approval
    conditions:
      - '#commits-behind=0'
      - or:
          - '#approved-reviews-by>=1'
          - label=ci:auto-merge
      - not:
          and:
            - 'head*=renovate/lockfile-maintenance-*'
            - 'created-at>24h ago'
      - base=master
      - check-success~=^test \(3\.[0-9]+\)$
      - check-success=pre-commit
      - check-success=dist-files
    actions:
      merge:
        method: squash
